<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Particles | Visual Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 40px; left: 40px; z-index: 10; pointer-events: none; }
        h1 { font-size: 2rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
        p { font-size: 0.9rem; opacity: 0.6; margin-top: 10px; }
        #error { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; color: red; font-family: monospace; padding: 20px; text-align: center; }
        #side-rail { position: fixed; right: 34px; top: 50%; z-index: 10; display: flex; min-height: 226px; transform: translateY(-50%); flex-direction: column; align-items: center; justify-content: space-between; color: rgba(205,183,255,.78); font-size: 9px; letter-spacing: .17em; text-transform: uppercase; pointer-events: none; }
        #side-rail::before { content: ''; position: absolute; top: 31px; bottom: 31px; width: 1px; background: linear-gradient(transparent, rgba(204,170,255,.85), transparent); }
        #side-rail .rail-label { writing-mode: vertical-rl; transform: rotate(180deg); }
        #side-rail .rail-dot { position: relative; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; box-shadow: 0 0 13px rgba(191,148,255,.8); }
        #side-rail .rail-dot::after { content: ''; position: absolute; inset: 2px; border-radius: inherit; background: currentColor; animation: pulse 2.4s ease-in-out infinite; }
        #side-rail .rail-readout { color: rgba(151,223,255,.7); font-size: 8px; writing-mode: vertical-rl; }
        @keyframes pulse { 50% { opacity: .15; transform: scale(2.6); } }
        @media (max-width: 640px) { #ui { top: 24px; left: 24px; } #side-rail { right: 17px; min-height: 150px; font-size: 7px; } #side-rail::before { top: 25px; bottom: 25px; } }
        @media (prefers-reduced-motion: reduce) { #side-rail .rail-dot::after { animation: none; } }
    </style>
    <link rel="stylesheet" href="assets/detail-audio.css">
</head>
<body>
    <div id="ui">
        <h1>Cosmic Flow</h1>
        <p>GPU Accelerated Particle System</p>
    </div>
    <aside id="side-rail" aria-hidden="true">
        <span class="rail-label">Ion flow</span>
        <span class="rail-dot"></span>
        <span class="rail-readout">100k particles</span>
    </aside>
    <div id="error"></div>
    <aside class="detail-audio-dock" aria-label="성운 사운드 제어">
      <button class="detail-sound-control" type="button" data-track-name="Nebula Particle System" data-ambient-toggle="particle-detail-audio" aria-pressed="false" aria-label="Nebula Particle System 사운드 켜기"><span data-ambient-label>sound off</span></button>
      <button id="mute-toggle" class="detail-mute-control" type="button" aria-pressed="false" aria-label="전체 음소거"><span data-mute-label>mute</span></button>
      <label class="detail-volume-wrap" aria-label="전체 볼륨"><input id="global-volume" type="range" min="0" max="100" value="44" step="1"><output id="volume-value" for="global-volume">44%</output></label>
    </aside>
    <audio id="particle-detail-audio" data-ambient preload="metadata" src="assets/audio/nebula-particles.mp3"></audio>
    <script src="assets/ambient-player.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.onload = async function() {
            const errorDiv = document.getElementById('error');
            try {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                camera.position.z = 5;

                const particleCount = 100000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 10;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
                    const color = new THREE.Color().setHSL(Math.random() * 0.2 + 0.5, 0.8, 0.6);
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.015,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });

                const points = new THREE.Points(geometry, material);
                scene.add(points);

                function animate() {
                    requestAnimationFrame(animate);
                    const time = performance.now() * 0.0001;
                    const pos = geometry.attributes.position.array;
                    for (let i = 0; i < particleCount; i++) {
                        const ix = i * 3;
                        const iy = i * 3 + 1;
                        const iz = i * 3 + 2;
                        pos[ix] += Math.sin(pos[iy] * 0.5 + time) * 0.002;
                        pos[iy] += Math.cos(pos[iz] * 0.5 + time) * 0.002;
                        pos[iz] += Math.sin(pos[ix] * 0.5 + time) * 0.002;
                    }
                    geometry.attributes.position.needsUpdate = true;
                    controls.update();
                    renderer.render(scene, camera);
                }
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                animate();
            } catch(e) {
                errorDiv.style.display = 'flex';
                errorDiv.innerText = "CRITICAL ERROR: " + e.message;
            }
        };
    </script>
</body>
</html>
