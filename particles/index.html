<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<title>Hyper-Particles | Visual Portfolio</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
    canvas { display: block; }
    #ui { position: absolute; top: 40px; left: 40px; z-index: 10; pointer-events: none; }
    h1 { font-size: 2rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
    p { font-size: 0.9rem; opacity: 0.6; margin-top: 10px; }
</style>
</head>
<body>
    <div id="ui">
        <h1>Cosmic Flow</h1>
        <p>GPU Accelerated Particle System</p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        (function() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            camera.position.z = 5;

            const particleCount = 100000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 10;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
                const color = new THREE.Color().setHSL(Math.random() * 0.2 + 0.5, 0.8, 0.6);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.015,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now() * 0.0001;
                const pos = geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const ix = i * 3;
                    const iy = i * 3 + 1;
                    const iz = i * 3 + 2;
                    pos[ix] += Math.sin(pos[iy] * 0.5 + time) * 0.002;
                    pos[iy] += Math.cos(pos[iz] * 0.5 + time) * 0.002;
                    pos[iz] += Math.sin(pos[ix] * 0.5 + time) * 0.002;
                }
                geometry.attributes.position.needsUpdate = true;
                controls.update();
                renderer.render(scene, camera);
            }
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        })();
    </script>
</body>
</html>
