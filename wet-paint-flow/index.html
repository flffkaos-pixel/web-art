<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <link rel="canonical" href="https://wet-paint-flow.simonxxoo.chatgpt.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wet Paint Flow" />
    <meta property="og:description" content="Real-time flow-field painting in the browser." />
    <meta property="og:url" content="https://wet-paint-flow.simonxxoo.chatgpt.site/" />
    <meta property="og:image" content="https://wet-paint-flow.simonxxoo.chatgpt.site/og.png" />

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Wet Paint Flow · 실시간 유화 브러시 생성기</title>

    <script type="module" crossorigin src="./assets/index-DqXtSUlG.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CzDU-wAD.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
      :root {
        --bg: #050607;
        --panel-bg: #0a0d0f;
        --line: rgba(221, 238, 241, .14);
        --text: #ecf5f4;
        --dim: rgba(222, 235, 235, .52);
        --ink: #ecf5f4;
        --canvas: #050607;
        --umber-deep: #8e5134;
      }
      html, body { background: var(--bg) !important; color: var(--text) !important; font-family: 'Inter', system-ui, sans-serif !important; }
      #model-light-control, .runtime-probes { display: none !important; }
      #source-controls .default-geometry-picker,
      #source-controls .model-source-controls,
      #source-controls .source-actions,
      #display-controls .brush-layer-switches { display: none !important; }
      #panel-resizer { display: none !important; }
      #app {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: none !important;
        grid-template-rows: none !important;
        background: var(--bg) !important;
      }
      .stage { flex: 1 !important; min-height: 50vh !important; }
      .panel {
        width: 100% !important;
        max-width: none !important;
        min-width: 0 !important;
        background: var(--panel-bg) !important;
        border-top: 1px solid var(--line) !important;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.3) !important;
        border-left: none !important;
        max-height: 45vh !important;
        overflow-y: auto !important;
        color: var(--text) !important;
        scrollbar-color: #67402d57 transparent;
      }
      .panel-head { border-bottom-color: var(--line) !important; }
      .panel-kicker { color: var(--dim) !important; }
      .panel-section { border-bottom-color: var(--line) !important; }
      .section-heading strong { color: var(--text) !important; }
      .growth-section-head strong { color: var(--text) !important; }
      .layer-tabs label { color: var(--dim) !important; }
      .layer-tabs input:checked + span { color: var(--text) !important; }
      .brush-layer-toggle { color: var(--dim) !important; }
      .brush-layer-toggle b { color: var(--text) !important; }
      .slider-row span { color: var(--dim) !important; }
      .slider-row output { color: var(--text) !important; }
      .quality-row span { color: var(--dim) !important; }
      .quality-row select { color: var(--text) !important; background: var(--panel-bg) !important; border-color: var(--line) !important; }
      .export-button { background: rgba(142, 81, 52, .15) !important; color: var(--text) !important; border: 1px solid var(--line) !important; }
      .export-button:hover { background: rgba(142, 81, 52, .3) !important; }
      .accent { background: var(--umber-deep) !important; color: #fff !important; }
      .accent:hover { background: #a05e3e !important; }
      .scene-card { background: rgba(255,255,255,.04) !important; border-color: var(--line) !important; }
      .scene-card span { color: var(--dim) !important; }
      .scene-card.is-selected { border-color: var(--umber-deep) !important; }
      .scene-card:hover { border-color: var(--umber-deep) !important; background: rgba(142, 81, 52, .12) !important; }
      .scene-tour-bar { background: rgba(255,255,255,.03) !important; border-top: 1px solid var(--line) !important; }
      .scene-tour-bar span { color: var(--dim) !important; }
      .upload-drop { border-color: var(--line) !important; background: rgba(255,255,255,.03) !important; }
      .upload-drop:hover { border-color: var(--umber-deep) !important; background: rgba(142, 81, 52, .08) !important; }
      .upload-icon { color: var(--dim) !important; }
      .upload-copy strong { color: var(--text) !important; }
      .upload-copy small { color: var(--dim) !important; }
      .language-toggle { color: var(--dim) !important; border-color: var(--line) !important; }
      .language-toggle:hover { color: var(--text) !important; border-color: var(--umber-deep) !important; }
      .timeline-toggle { color: var(--dim) !important; border-color: var(--line) !important; }
      .timeline-toggle[aria-pressed="true"] { color: var(--text) !important; border-color: var(--umber-deep) !important; background: rgba(142, 81, 52, .15) !important; }
      .growth-scrubber-head span { color: var(--dim) !important; }
      .growth-scrubber-head output { color: var(--text) !important; }
      .text-button { color: var(--dim) !important; }
      .text-button:hover { color: var(--text) !important; }
      input[type="range"] { accent-color: var(--umber-deep) !important; }
      .signature-credit { border-top-color: var(--line) !important; }
      .signature-creators a { color: var(--dim) !important; }
      .signature-creators a:hover { color: var(--text) !important; }
      .repository-link { color: var(--dim) !important; }
      .repository-link:hover { color: var(--text) !important; }
      .scene-picker-current b { color: var(--text) !important; }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="stage" aria-label="방향장 실시간 브러시 실험">
        <div id="canvas-mount" title="마우스 휠로 확대/축소 · 더블클릭으로 초기화"></div>
        <div id="model-light-control" class="model-light-control" hidden>
          <label for="model-light-angle">
            <span data-i18n="lightAngle">환경광 각도</span>
            <output id="model-light-angle-output">-52°</output>
          </label>
          <input id="model-light-angle" type="range" min="-180" max="180" step="1" value="-52" />
        </div>
      </section>

      <div
        id="panel-resizer"
        class="panel-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-controls="control-panel"
        aria-valuemin="360"
        aria-valuenow="360"
        tabindex="0"
        data-i18n-aria-label="resizePanel"
      ></div>

      <aside id="control-panel" class="panel" aria-label="브러시 생성 속성">
        <header class="panel-head">
          <div class="panel-title">
            <span class="panel-kicker">Wet Paint Flow</span>
          </div>
          <button id="language-toggle" class="language-toggle" type="button" aria-label="한국어로 전환">
            <span>한</span><span>EN</span>
          </button>
        </header>

        <section id="growth-controls" class="panel-section growth-section">
          <div class="growth-section-head">
            <div>
              <strong data-i18n="growthControl">생성 제어</strong>
              <span id="growth-progress">생성 대기 중</span>
            </div>
            <button id="replay-growth-button" class="accent compact-action" type="button" data-i18n="restartGrowth">다시 생성</button>
          </div>
          <div class="growth-scrubber">
            <div class="growth-scrubber-head">
              <span data-i18n="growthTimeline">생성 타임라인</span>
              <output id="growth-time-label" for="growth-timeline">00:00.0 / 00:05.0</output>
            </div>
            <div class="growth-scrubber-row">
              <button id="pause-button" class="timeline-toggle" type="button" aria-pressed="false" data-i18n="pause">일시정지</button>
              <input
                id="growth-timeline"
                type="range"
                min="0"
                max="5"
                step="0.01"
                value="0"
                aria-label="생성 애니메이션 타임라인"
                data-i18n-aria-label="growthTimelineAria"
              />
            </div>
          </div>
        </section>

        <section id="source-controls" class="panel-section source-control">
          <div class="section-heading">
            <div><strong data-i18n="source">소스</strong></div>
            <output id="source-mode" class="visually-hidden">내장 장면</output>
          </div>
          <input id="source-upload" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/*,.glb,model/gltf-binary,model/gltf+binary" />
          <label id="upload-drop" class="upload-drop" for="source-upload">
            <span class="upload-icon" aria-hidden="true">+</span>
            <span class="upload-copy">
              <strong data-i18n="importSource">이미지 또는 GLB 가져오기</strong>
              <small data-i18n="localProcessing">JPG / PNG / WebP / GLB · 로컬 처리</small>
            </span>
          </label>
          <div class="default-geometry-picker" aria-label="기본 기하학">
            <div class="default-geometry-heading">
              <strong data-i18n="defaultGeometry">기본 기하학</strong>
              <label class="model-analysis-toggle" for="live-model-analysis">
                <span data-i18n="liveStrokeFollow">실시간 브러시 추적</span>
                <input id="live-model-analysis" type="checkbox" />
                <i aria-hidden="true"></i>
              </label>
            </div>
            <div class="default-geometry-grid">
              <button type="button" data-default-geometry="sphere" aria-pressed="false"><i aria-hidden="true">●</i><span data-i18n="sphere">구체</span></button>
              <button type="button" data-default-geometry="cube" aria-pressed="false"><i aria-hidden="true">■</i><span data-i18n="cube">정육면체</span></button>
              <button type="button" data-default-geometry="torus" aria-pressed="false"><i aria-hidden="true">◎</i><span data-i18n="torus">토러스</span></button>
              <button type="button" data-default-geometry="knot" aria-pressed="false"><i aria-hidden="true">∞</i><span data-i18n="knot">매듭</span></button>
            </div>
            <div class="model-color-row" aria-label="모델 색상">
              <span data-i18n="modelColor">모델 색상</span>
              <div class="model-color-palette">
                <button type="button" data-model-color="#b9783e" aria-label="오커" title="오커"></button>
                <button type="button" data-model-color="#526d9d" aria-label="울트라마린" title="울트라마린"></button>
                <button type="button" data-model-color="#66856c" aria-label="세이지 그린" title="세이지 그린"></button>
                <button type="button" data-model-color="#9f5d58" aria-label="테라코타" title="테라코타"></button>
                <button type="button" data-model-color="#c8bda7" aria-label="석고 화이트" title="석고 화이트"></button>
                <button type="button" data-model-color="#3e4148" aria-label="차콜 블랙" title="차콜 블랙"></button>
                <label class="model-color-custom" for="model-color-custom" title="사용자 지정 색상">
                  <input id="model-color-custom" type="color" value="#526d9d" aria-label="사용자 지정 모델 색상" />
                  <span aria-hidden="true">+</span>
                </label>
              </div>
            </div>
          </div>
          <div id="model-source-controls" class="model-source-controls" hidden>
            <div class="model-source-summary">
              <strong id="model-source-name">모델</strong>
              <small id="model-source-meta">—</small>
            </div>
            <div class="model-view-actions" aria-label="모델 표시">
              <button id="model-preview-button" type="button" aria-pressed="false" data-i18n="preview3d">3D 미리보기</button>
              <button id="model-paint-button" type="button" aria-pressed="false" data-i18n="strokeResult">브러시 결과</button>
            </div>
          </div>
          <details id="scene-library" class="scene-library" open>
            <summary>
              <span class="scene-picker-copy">
                <strong data-i18n="builtInWorks">내장 원작</strong>
                <small data-i18n="elevenWorks">11점</small>
              </span>
              <span class="scene-picker-current">
                <b id="scene-picker-label">불러오는 중…</b>
                <i aria-hidden="true"></i>
              </span>
            </summary>
            <div class="scene-tour-bar">
              <span data-i18n="strokeMorph">작품 간 브러시 변형</span>
              <button id="scene-tour-toggle" type="button" aria-pressed="false" data-i18n="startTour">자동 순회</button>
            </div>
            <div id="scene-grid" class="scene-grid" role="list" aria-label="내장 방향장 장면">
              <span class="scene-loading" data-i18n="loadingScenes">장면 불러오는 중…</span>
            </div>
          </details>
          <div class="source-actions">
            <span id="source-meta" class="visually-hidden">내장 장면 사용 중</span>
            <button id="restore-scene-button" class="text-button" type="button" disabled data-i18n="restoreScene">내장 장면 복원</button>
          </div>
        </section>

        <section id="display-controls" class="panel-section layer-section">
          <div class="section-heading">
            <div><strong data-i18n="display">화면 표시</strong></div>
          </div>
          <div class="layer-tabs" role="radiogroup" aria-label="화면 표시">
            <label>
              <input type="radio" name="layer-mode" value="5" />
              <span class="layer-choice brush-choice">
                <i aria-hidden="true"></i>
                <strong data-i18n="brushOnly">브러시만</strong>
                <small data-i18n="beigeCanvas">베이지 캔버스</small>
              </span>
            </label>
            <label>
              <input type="radio" name="layer-mode" value="3" checked />
              <span class="layer-choice original-choice">
                <i aria-hidden="true"></i>
                <strong id="source-preview-label" data-i18n="original">원본</strong>
                <small id="source-preview-hint" data-i18n="noStrokes">브러시 없음</small>
              </span>
            </label>
            <label>
              <input type="radio" name="layer-mode" value="0" />
              <span class="layer-choice blend-choice">
                <i aria-hidden="true"></i>
                <strong data-i18n="brushAndOriginal">브러시+원본</strong>
                <small data-i18n="blendedView">혼합 표시</small>
              </span>
            </label>
            <label>
              <input type="radio" name="layer-mode" value="1" />
              <span class="layer-choice flow-choice">
                <i aria-hidden="true"></i>
                <strong data-i18n="flowSketch">흐름도 초안</strong>
                <small data-i18n="pencilFlow">연필 방향선</small>
              </span>
            </label>
          </div>
          <fieldset class="brush-layer-switches">
            <legend data-i18n="brushLayers">브러시 레이어</legend>
            <div class="brush-layer-switch-grid">
              <label>
                <input type="checkbox" data-brush-layer="0" checked />
                <span class="brush-layer-toggle coarse-layer">
                  <i aria-hidden="true"></i>
                  <b data-i18n="coarse">굵은 층</b>
                  <small data-i18n="structure">구조</small>
                </span>
              </label>
              <label>
                <input type="checkbox" data-brush-layer="1" checked />
                <span class="brush-layer-toggle medium-layer">
                  <i aria-hidden="true"></i>
                  <b data-i18n="medium">보통 층</b>
                  <small data-i18n="shaping">성형</small>
                </span>
              </label>
              <label>
                <input type="checkbox" data-brush-layer="2" checked />
                <span class="brush-layer-toggle fine-layer">
                  <i aria-hidden="true"></i>
                  <b data-i18n="fine">얇은 층</b>
                  <small data-i18n="texture">질감</small>
                </span>
              </label>
            </div>
          </fieldset>
        </section>

        <section id="stroke-controls" class="panel-section effect-section">
          <div class="section-heading">
            <div><strong data-i18n="strokeEffects">브러시 효과</strong></div>
            <output id="stroke-count" class="visually-hidden">—</output>
          </div>
          <label class="quality-row quality-row-primary" for="quality-mode">
            <span data-i18n="previewQuality">미리보기 선명도</span>
            <select id="quality-mode">
              <option value="balanced" data-i18n="qualityBalanced">부드러움</option>
              <option value="high" selected data-i18n="qualityHigh">고해상도</option>
              <option value="ultra" data-i18n="qualityUltra">극한</option>
            </select>
          </label>
          <label class="slider-row">
            <span data-i18n="strokeSize">브러시 크기</span><output data-output="strokeSize">1.00</output>
            <input data-param="strokeSize" type="range" min="0.35" max="3.2" step="0.01" value="1" />
          </label>
          <label class="slider-row">
            <span data-i18n="strokeLength">브러시 길이</span><output data-output="length">1.48</output>
            <input data-param="length" type="range" min="0.55" max="6" step="0.01" value="1.48" />
          </label>
          <label class="slider-row">
            <span data-i18n="strokeCount">브러시 수</span><output data-output="strokeCountK">14,000</output>
            <input data-param="strokeCountK" type="range" min="3" max="24" step="1" value="14" />
          </label>
          <label class="slider-row">
            <span data-i18n="paintThickness">안료 두께</span><output data-output="impasto">0.04</output>
            <input data-param="impasto" type="range" min="0" max="1.5" step="0.01" value="0.04" />
          </label>
          <label class="slider-row">
            <span data-i18n="paintDryness">안료 건조도</span><output data-output="dryness">0.69</output>
            <input data-param="dryness" type="range" min="0" max="1" step="0.01" value="0.69" />
          </label>
          <label class="slider-row">
            <span data-i18n="paintViscosity">안료 점도</span><output data-output="viscosity">0.58</output>
            <input data-param="viscosity" type="range" min="0" max="1" step="0.01" value="0.58" />
          </label>
        </section>

        <section id="output-controls" class="panel-section create-section">
          <div class="section-heading">
            <div><strong data-i18n="generateExport">생성 및 내보내기</strong></div>
            <span class="fps-badge visually-hidden"><b id="fps">—</b></span>
          </div>
          <div class="actions">
            <div class="export-actions">
              <div class="export-action">
                <button id="export-button" class="export-button export-action-button" type="button" data-i18n="exportPng">4K PNG 내보내기</button>
              </div>
              <div class="export-action">
                <button id="video-export-button" class="export-button export-action-button" type="button" data-i18n="exportVideo">생성 영상 내보내기</button>
              </div>
            </div>
          </div>
        </section>

        <footer class="signature-credit" aria-label="Creators">
          <div class="signature-creators">
            <a href="https://x.com/ring_hyacinth" target="_blank" rel="noopener noreferrer">Hyacinth</a>
            <span aria-hidden="true">&amp;</span>
            <a href="https://x.com/simonxxoo" target="_blank" rel="noopener noreferrer">Simon</a>
          </div>
          <a class="repository-link" href="https://github.com/simonxxooxxoo/wet-paint-flow" target="_blank" rel="noopener noreferrer">github.com/simonxxooxxoo/wet-paint-flow</a>
        </footer>

        <div class="runtime-probes" aria-hidden="true">
          <span id="runtime-status">캔버스 준비 중…</span>
          <span id="gbuffer-size">—</span>
          <span id="seed-churn">0.0%</span>
          <span id="field-time">—</span>
          <span id="renderer-name">WebGL2</span>
          <span id="flow-sum">1.00</span>
        </div>
      </aside>
    </main>

    <script>
      window.__vangoghFlowErrors = [];
      const reportFlowError = (message) => {
        window.__vangoghFlowErrors.push(String(message));
        const status = document.getElementById('runtime-status');
        if (status) status.textContent = `ERROR · ${message}`;
      };
      window.addEventListener('error', (event) => reportFlowError(event.message || event.error));
      window.addEventListener('unhandledrejection', (event) => reportFlowError(event.reason));
    </script>

  </body>
</html>
