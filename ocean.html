<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ABYSSAL — Spectral FFT Ocean</title>
<style>
  :root{
    --bg:#05080c; --panel:rgba(10,16,22,.82); --line:rgba(140,200,230,.16);
    --txt:#cfe3ee; --dim:#7d95a4; --acc:#5fd0e8;
    --sheet-h:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;width:100%;background:var(--bg);overflow:hidden;
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--txt);
    overscroll-behavior:none;-webkit-text-size-adjust:100%;color-scheme:dark}
  canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
  #panel{
    position:fixed;top:12px;right:12px;width:288px;max-height:calc(100dvh - 24px);
    overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:10;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
    transition:transform .28s ease,opacity .22s ease
  }
  #panel::-webkit-scrollbar{width:7px}
  #panel::-webkit-scrollbar-thumb{background:rgba(120,180,210,.22);border-radius:4px}
  #panel h1{font-size:12px;letter-spacing:.22em;margin:2px 0 10px;color:var(--acc);font-weight:600}
  #panel h1 small{display:block;letter-spacing:.05em;color:var(--dim);font-weight:400;font-size:10px;margin-top:3px}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .panel-head h1{flex:1;min-width:0}
  .tools-btn{
    display:none;align-items:center;justify-content:center;flex-shrink:0;min-height:32px;
    margin-top:1px;padding:6px 10px;border:1px solid var(--line);
    border-radius:6px;background:rgba(140,200,230,.08);color:var(--acc);font:inherit;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation
  }
  .tools-btn:active{background:rgba(95,208,232,.22)}
  #tools-show{
    position:fixed;z-index:20;right:max(10px, env(safe-area-inset-right));
    bottom:max(12px, env(safe-area-inset-bottom));padding:8px 12px;
    background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.45)
  }
  .grp{border-top:1px solid var(--line);margin-top:9px;padding-top:7px}
  .grp>b{display:block;color:var(--acc);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;cursor:pointer;user-select:none;opacity:.85;margin-bottom:5px}
  .grp>b:before{content:"▾ ";font-size:9px}
  .grp.closed>b:before{content:"▸ "}
  .grp.closed .body{display:none}
  .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .row label{flex:1 1 auto;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row output{width:50px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(140,200,230,.24);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;
    border-radius:50%;background:var(--acc);box-shadow:0 0 8px rgba(95,208,232,.7);cursor:pointer}
  input[type=range]::-moz-range-track{height:2px;background:rgba(140,200,230,.24)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--acc)}
  .rowfull{display:block;margin:5px 0 8px}
  .rowfull .hd{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:1px}
  .rowfull .hd span:last-child{color:var(--txt);font-variant-numeric:tabular-nums}
  input[type=color]{width:34px;height:20px;padding:0;border:1px solid var(--line);
    border-radius:4px;background:none;cursor:pointer}
  select{background:#0c141b;color:var(--txt);border:1px solid var(--line);border-radius:4px;
    padding:2px 4px;font:inherit;font-size:11px}
  .chk{display:flex;align-items:center;gap:6px;margin:4px 0;cursor:pointer;color:var(--dim)}
  .chk input{accent-color:var(--acc)}
  #hud{position:fixed;left:12px;bottom:12px;z-index:10;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
    backdrop-filter:blur(14px);line-height:1.6}
  #hud b{color:var(--acc);font-weight:600}
  #sound-toggle{appearance:none;border:1px solid var(--line);background:rgba(140,200,230,.10);
    color:var(--txt);border-radius:100px;padding:2px 9px;font:inherit;font-size:10px;
    letter-spacing:.08em;cursor:pointer;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #sound-toggle.is-playing{color:var(--acc);border-color:currentColor;background:rgba(95,208,232,.16)}
  #sound-toggle:active{transform:scale(.97)}
  #hud kbd{background:rgba(140,200,230,.13);border:1px solid var(--line);border-radius:3px;
    padding:0 4px;color:var(--txt)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#05080c;z-index:50;transition:opacity .6s}
  #boot .t{letter-spacing:.4em;color:var(--acc);font-size:13px}
  #boot .s{color:var(--dim);font-size:11px}
  #boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:40px;text-align:center;color:#ff9a9a;background:#05080c;z-index:60;line-height:1.8}
  #pads{display:none}
  .cluster{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
  .cluster>span{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .dpad{display:grid;grid-template-areas:". n ." "w c e" ". s .";
    grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;gap:5px}
  .heave{display:flex;flex-direction:column;gap:5px}
  #pads button{
    width:46px;height:46px;padding:0;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--acc);font:700 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.4);touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer
  }
  #pads button:active,#pads button.held{background:rgba(95,208,232,.22);border-color:rgba(95,208,232,.45)}
  #pads button[data-slot=n]{grid-area:n}
  #pads button[data-slot=s]{grid-area:s}
  #pads button[data-slot=w]{grid-area:w}
  #pads button[data-slot=e]{grid-area:e}
  @media (pointer:coarse), (max-width:900px){
    #tools-hide{display:inline-flex}
    body.tools-hidden #tools-show{display:inline-flex}
    body.tools-hidden{--sheet-h:0px}
    body.tools-hidden #panel{
      transform:translateY(110%);opacity:0;pointer-events:none
    }
  }
  @media (pointer:coarse){
    .desk-hint{display:none}
    #hud{
      top:max(10px, env(safe-area-inset-top));bottom:auto;
      left:max(10px, env(safe-area-inset-left));right:auto;
      max-width:calc(100vw - 20px);font-size:10px;padding:6px 8px
    }
    #pads{
      display:flex;align-items:flex-end;gap:8px;position:fixed;z-index:12;
      left:max(8px, env(safe-area-inset-left));
      bottom:max(12px, env(safe-area-inset-bottom));
      pointer-events:none
    }
    input[type=range]{height:28px}
    input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-8px}
  }
  @media (max-width:900px) and (orientation:portrait){
    :root{--sheet-h:min(40dvh, 340px)}
    #panel{
      top:auto;right:0;left:0;bottom:0;width:100%;max-height:var(--sheet-h);
      border-radius:14px 14px 0 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -12px 40px rgba(0,0,0,.5)
    }
    #pads{
      display:flex;align-items:flex-end;gap:8px;position:fixed;z-index:12;
      left:max(8px, env(safe-area-inset-left));
      bottom:calc(var(--sheet-h) + 8px);
      pointer-events:none
    }
    #hud{
      top:max(10px, env(safe-area-inset-top));bottom:auto;
      left:max(10px, env(safe-area-inset-left))
    }
    .desk-hint{display:none}
  }
  @media (max-width:430px){
    .dpad{grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px 38px;gap:4px}
    #pads{gap:6px}
    #pads button{width:38px;height:38px;border-radius:8px}
  }
  @media (max-width:900px) and (max-height:700px) and (orientation:portrait){
    :root{--sheet-h:min(34dvh, 250px)}
  }
  @media (max-width:950px) and (orientation:landscape){
    :root{--sheet-h:0px}
    #panel{
      top:max(8px, env(safe-area-inset-top));right:max(8px, env(safe-area-inset-right));
      bottom:max(8px, env(safe-area-inset-bottom));left:auto;
      width:min(250px, 40vw);max-height:none;border-radius:10px;
      padding:8px 10px 12px
    }
    #pads{
      left:max(8px, env(safe-area-inset-left));
      bottom:max(10px, env(safe-area-inset-bottom))
    }
    .dpad{grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px 38px;gap:4px}
    #pads button{width:38px;height:38px}
    .desk-hint{display:none}
    body.tools-hidden #panel{transform:translateX(110%)}
  }
  #hud.hidden, #pads.hidden { display:none !important; }

  /* 3rd-person beach controls */
  #joy, #sit-btn{display:none}
  @media (pointer:coarse){
    #joy{
      display:block;position:fixed;z-index:12;
      right:max(16px, env(safe-area-inset-right));
      bottom:max(18px, env(safe-area-inset-bottom));
      width:116px;height:116px;border-radius:50%;
      border:1px solid var(--line);background:rgba(10,16,22,.4);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none
    }
    #joy-knob{
      position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
      border-radius:50%;background:rgba(95,208,232,.32);border:1px solid rgba(95,208,232,.55);
      pointer-events:none
    }
    #sit-btn{
      display:block;position:fixed;z-index:12;
      right:max(16px, env(safe-area-inset-right));
      bottom:calc(max(18px, env(safe-area-inset-bottom)) + 132px);
      min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:22px;
      background:var(--panel);color:var(--acc);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation
    }
    #sit-btn.on{background:rgba(95,208,232,.25);border-color:rgba(95,208,232,.5)}
    body.tools-hidden #tools-show{
      right:max(16px, env(safe-area-inset-right));
      bottom:calc(max(18px, env(safe-area-inset-bottom)) + 192px)
    }
  }
  @media (max-width:950px) and (orientation:landscape){
    #joy{
      right:auto;left:max(16px, env(safe-area-inset-left));
      bottom:calc(max(16px, env(safe-area-inset-bottom)) + 60px)
    }
    #sit-btn{
      right:auto;left:max(16px, env(safe-area-inset-left));
      bottom:calc(max(16px, env(safe-area-inset-bottom)) + 192px)
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div><b id="fps">--</b> fps &nbsp;·&nbsp; <span id="stat"></span> &nbsp;·&nbsp; <span id="peers"></span> &nbsp;·&nbsp; <button type="button" id="sound-toggle" aria-pressed="false" aria-label="파도 소리 켜기"><span id="sound-label">waves off</span></button></div>
  <div class="desk-hint"><kbd>drag</kbd> look &nbsp; <kbd>W A S D</kbd> move &nbsp; <kbd>Space</kbd>/<kbd>Ctrl</kbd> up/down &nbsp; <kbd>wheel</kbd> speed</div>
</div>

<div id="joy" aria-label="이동 조이스틱"><div id="joy-knob"></div></div>
<button type="button" id="sit-btn" class="on">stand</button>

<div id="boot"><div class="t">ABYSSAL</div><div class="s" id="bootmsg">initialising…</div></div>
<div id="err"></div>





<style id="ultra-water-ui">
  #pads{display:none!important}
  #ui{padding:0;margin:0}
  #panel .lil-gui{
    --font-size:11px;--font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --background-color:transparent;--text-color:#cfe3ee;--title-background-color:transparent;--title-text-color:#5fd0e8;
    --widget-color:rgba(140,200,230,.14);--hover-color:rgba(140,200,230,.26);--focus-color:rgba(95,208,232,.42);
    --number-color:#5fd0e8;--string-color:#7ce0c0;
  }
  #panel .lil-gui.lil-root{position:static;width:100%;max-height:none;background:transparent;border:0;border-radius:0;box-shadow:none}
  #panel .lil-gui.lil-root>.lil-title{display:none}
  #panel .lil-gui .lil-children{border-left-color:rgba(140,200,230,.14)}
  #panel .lil-controller>.lil-name{color:#9fb6c4}
</style>
<script type="module">
import { createOcean } from './assets/ultra-water/ultra-ocean.js';

const bootEl = document.getElementById('boot');
const bootMsg = document.getElementById('bootmsg');
const errEl = document.getElementById('err');
const step = (m) => { if (bootMsg) bootMsg.textContent = m; };
function fatal(msg){ if (errEl){ errEl.style.display = 'flex'; errEl.innerHTML = msg; } if (bootEl) bootEl.classList.add('gone'); }

try {
  const test = document.createElement('canvas').getContext('webgl2');
  if (!test) throw new Error('WebGL2 is required.<br>Please use a recent desktop browser.');
  if (!test.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float is unavailable.<br>Floating-point render targets are required for the simulation.');
} catch (e) { fatal(e.message || String(e)); }

step('compiling shaders…');

let app = null;
try {
  app = createOcean({
    canvas: document.getElementById('c'),
    title: 'Spectral FFT Ocean',
    perfPanel: false,
    showGui: false,
    hud: { fps: document.getElementById('fps'), stat: document.getElementById('stat') },
    onReady: () => { if (bootEl){ bootEl.classList.add('gone'); setTimeout(() => bootEl.remove(), 800); } },
  });
} catch (e) {
  fatal('Startup failed:<br><code style="color:#ffb">' + (e && e.message ? e.message : e) + '</code>');
}

const hint = document.querySelector('#hud .desk-hint');
if (hint) hint.innerHTML = '<kbd>W A S D</kbd> walk &nbsp; <kbd>Shift</kbd> run &nbsp; <kbd>F</kbd> sit / stand &nbsp; <kbd>drag</kbd> orbit &nbsp; <kbd>wheel</kbd> zoom';

let playStep = null;
/* ---------- procedural surf — waves only, no music ---------- */
{
  const btn = document.getElementById('sound-toggle'), lbl = document.getElementById('sound-label');
  let ctx = null, master = null, stepGain = null, hiss = null, buf = null, swell = 0, on = false, audioEl = null;

  function brown(){
    const sr = ctx.sampleRate, len = sr * 4, b = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++){
      const d = b.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    }
    return b;
  }
  function layer(type, freq, depth, rate){
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    src.playbackRate.value = 0.85 + Math.random() * 0.3;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 0.5;
    const g = ctx.createGain(); g.gain.value = 1;
    const lfo = ctx.createOscillator(); lfo.frequency.value = rate;
    const lg = ctx.createGain(); lg.gain.value = depth;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(master);
    lfo.start(); src.start();
    return g;
  }
  function crash(){
    if (!on || !ctx) return;
    const t = ctx.currentTime;
    hiss.gain.cancelScheduledValues(t);
    hiss.gain.setValueAtTime(hiss.gain.value, t);
    hiss.gain.linearRampToValueAtTime(2.4, t + 1.2);
    hiss.gain.linearRampToValueAtTime(1, t + 4);
    swell = setTimeout(crash, 4500 + Math.random() * 4500);
  }
  function build(){
    if (ctx) return;
    if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    stepGain = ctx.createGain(); stepGain.gain.value = 1.1; stepGain.connect(ctx.destination);
    buf = brown();
    layer('lowpass', 360, 0.45, 0.055);
    hiss = layer('bandpass', 920, 0.3, 0.1);
  }
  function useFallback(){
    if (audioEl) return;
    audioEl = new Audio('assets/audio/island-ocean.mp3');
    audioEl.loop = true; audioEl.volume = 0.55;
    audioEl.play().catch(() => {});
    ramp(0, 0.4);
  }
  function ramp(v, dur){
    if (!ctx) return;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(v, t + dur);
  }
  function refresh(){
    if (btn){ btn.setAttribute('aria-pressed', String(on)); btn.classList.toggle('is-playing', on); }
    if (lbl) lbl.textContent = on ? 'waves on' : 'waves off';
  }
  function step(){
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    // low thump (body of the step)
    const s1 = ctx.createBufferSource(); s1.buffer = buf; s1.loop = true; s1.playbackRate.value = 0.8 + Math.random() * 0.4;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 1.0;
    const g1 = ctx.createGain(); g1.gain.setValueAtTime(0.0001, t); g1.gain.linearRampToValueAtTime(1.1, t + 0.015); g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    s1.connect(lp); lp.connect(g1); g1.connect(stepGain);
    s1.start(t, Math.random() * 2); s1.stop(t + 0.26);
    // bright sploosh (hiss of the water)
    const s2 = ctx.createBufferSource(); s2.buffer = buf; s2.loop = true; s2.playbackRate.value = 1.0 + Math.random() * 0.5;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 + Math.random() * 1200; bp.Q.value = 0.6;
    const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(1.2, t + 0.012); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    s2.connect(bp); bp.connect(g2); g2.connect(stepGain);
    s2.start(t, Math.random() * 2); s2.stop(t + 0.2);
  }
  playStep = step;
  function toggle(e){
    if (e && e.cancelable) e.preventDefault();
    on = !on;
    if (on){
      build();
      if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
      ramp(0.6, 1.2);
      if (!swell) swell = setTimeout(crash, 900);
      setTimeout(() => { if (on && (!ctx || ctx.state !== 'running')) useFallback(); }, 800);
    } else {
      clearTimeout(swell); swell = 0;
      ramp(0, 0.3);
      if (audioEl) { try { audioEl.pause(); } catch (e) {} }
      if (ctx) setTimeout(() => { if (!on && ctx.state === 'running') ctx.suspend().catch(() => {}); }, 400);
    }
    refresh();
  }
  if (btn) btn.addEventListener('click', toggle);
  addEventListener('pointerdown', () => { build(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); }, { once: true });
  addEventListener('keydown', () => { build(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); }, { once: true });
}

/* ---------- ambience: sun follows the clock; the sea drifts calm ↔ stormy ---------- */
let seaTick = null;
let netRoom = null, netEvent = null;
if (app){
  const auto = true;
  const KEYS = [  // hour → wind, waves, chop, swell, sun intensity, clouds, haze, spray
    [0,    { ws: 6,  wv: 0.75, ch: 0.90, sw: 0.80, si: 4,  cc: 0.30, tb: 1.8, sp: 0.5 }],
    [6,    { ws: 8,  wv: 0.90, ch: 1.00, sw: 0.90, si: 8,  cc: 0.42, tb: 2.6, sp: 0.8 }],
    [9,    { ws: 10, wv: 1.00, ch: 1.05, sw: 1.00, si: 10, cc: 0.38, tb: 2.1, sp: 1.0 }],
    [13,   { ws: 12, wv: 1.10, ch: 1.10, sw: 1.05, si: 12, cc: 0.34, tb: 2.0, sp: 1.1 }],
    [16,   { ws: 14, wv: 1.25, ch: 1.20, sw: 1.10, si: 10, cc: 0.46, tb: 2.6, sp: 1.3 }],
    [18.5, { ws: 12, wv: 1.10, ch: 1.10, sw: 1.00, si: 8,  cc: 0.50, tb: 3.0, sp: 1.2 }],
    [21,   { ws: 8,  wv: 0.85, ch: 0.95, sw: 0.85, si: 4,  cc: 0.36, tb: 2.2, sp: 0.7 }],
    [24,   { ws: 6,  wv: 0.75, ch: 0.90, sw: 0.80, si: 4,  cc: 0.30, tb: 1.8, sp: 0.5 }],
  ];
  function lerpKeys(t){
    let a = KEYS[0], b = KEYS[KEYS.length - 1];
    for (let i = 0; i < KEYS.length - 1; i++) if (t >= KEYS[i][0] && t <= KEYS[i + 1][0]){ a = KEYS[i]; b = KEYS[i + 1]; break; }
    const f = (t - a[0]) / Math.max(1e-6, b[0] - a[0]), o = {};
    for (const k in a[1]) o[k] = a[1][k] + (b[1][k] - a[1][k]) * f;
    return o;
  }
  function applyAmbience(){
    if (!auto) return;
    const d = new Date();
    const t = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
    const m = lerpKeys(t);
    app.sky.params.elevation = Math.max(-8, 44 * Math.cos((t - 12.7) / 24 * Math.PI * 2));
    app.sky.params.azimuth = (90 + (((t - 6.7 + 24) % 24) / 24) * 360) % 360;
    app.sky.params.sunIntensity = m.si;
    app.sky.params.turbidity = m.tb;
    app.markSun();
  }
  applyAmbience();
  setInterval(applyAmbience, 10000);

  const SEA = [
    { nm: '잔잔', ws: 3.0, wv: 0.32, ch: 0.65, sw: 0.28, cc: 0.12, sp: 0.20 },
    { nm: '보통', ws: 6.0, wv: 0.65, ch: 0.90, sw: 0.65, cc: 0.28, sp: 0.55 },
    { nm: '거칠', ws: 10.5, wv: 1.10, ch: 1.15, sw: 1.05, cc: 0.44, sp: 1.05 },
    { nm: '폭풍', ws: 17.0, wv: 1.65, ch: 1.45, sw: 1.55, cc: 0.58, sp: 1.70 },
  ];
  const SEA_W = [0.45, 0.30, 0.17, 0.08];
  const K = ['ws', 'wv', 'ch', 'sw', 'cc', 'sp'];
  let a = SEA[1], b = SEA[1], f = 1, holdLeft = 6, dirtyAcc = 0, sunAcc = 0;
  const cur = Object.assign({}, SEA[1]);
  function pickSea(){
    a = Object.assign({}, cur);
    const r = Math.random(); let i = 0, acc = 0;
    for (; i < SEA.length; i++){ acc += SEA_W[i]; if (r < acc) break; }
    b = SEA[Math.min(i, SEA.length - 1)];
    f = 0;
  }
  seaTick = function (dt) {
    if (f < 1) f = Math.min(1, f + dt / 16);
    else { holdLeft -= dt; if (holdLeft <= 0){ pickSea(); holdLeft = 25 + Math.random() * 45; } }
    const s = f * f * (3 - 2 * f);
    for (const k of K) cur[k] = a[k] + (b[k] - a[k]) * s;
    app.ocean.params.windSpeed = cur.ws;
    app.ocean.params.waveScale = cur.wv;
    app.ocean.params.choppiness = cur.ch;
    app.ocean.params.swellScale = cur.sw;
    app.spray.params.amount = cur.sp;
    app.sky.params.cloudCoverage = cur.cc;
    dirtyAcc += dt; if (f < 1 && dirtyAcc > 0.4){ app.ocean.dirty = true; dirtyAcc = 0; }
    sunAcc += dt; if (f < 1 && sunAcc > 2.5){ app.markSun(); sunAcc = 0; }
  };
}

/* ---------- 3rd-person avatar sitting on the beach ---------- */
if (app){
  const T = app.THREE, hAt = app.islandHeight;
  const { scene, camera, controls } = app;
  const sitBtn = document.getElementById('sit-btn');

  const PASTELS = [0xf2b8c6, 0xa8d8c8, 0xa8c4e8, 0xf2e3a0, 0xd8b8f0, 0xf2c8a8];
  const SKINS = [0xfbe9db, 0xf7e0ce, 0xfdeee2, 0xf2d7c4, 0xf9e6d6];
  const HAIRS = [0x2a2a2e, 0x4a3624, 0x6b4a2a, 0x151515, 0x8a6a4a];
  const PANTS = [0x3a4a63, 0x2f3a4a, 0x50607a, 0x6a5a7a, 0x4a5a45, 0x7a5a4a, 0x44506a, 0x5a6a5a];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function makePerson(shirtC, pantsC, skinC, hairC, style){
    const g = new T.Group();
    const root = new T.Group(); g.add(root);
    const skin  = new T.MeshStandardMaterial({ color: skinC, roughness: 0.85 });
    const shirt = new T.MeshStandardMaterial({ color: shirtC, roughness: 0.95 });
    const pants = new T.MeshStandardMaterial({ color: pantsC, roughness: 0.95 });
    const dark  = new T.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.6 });
    const white = new T.MeshBasicMaterial({ color: 0xffffff });
    const blush = new T.MeshStandardMaterial({ color: 0xf59aa0, roughness: 1 });
    const hair  = new T.MeshStandardMaterial({ color: hairC, roughness: 0.9 });
    const stub = (r, len, mat) => new T.Mesh(new T.CapsuleGeometry(r, len, 6, 12), mat);

    // lower body (pants) + upper body (shirt) — rounded, Animal-Crossing-ish
    const hip = new T.Mesh(new T.SphereGeometry(0.21, 20, 16), pants); hip.position.y = 0.40; hip.scale.set(1.0, 0.86, 0.94); root.add(hip);
    const torso = new T.Mesh(new T.SphereGeometry(0.23, 20, 16), shirt); torso.position.y = 0.62; torso.scale.set(1.0, 1.16, 0.92); root.add(torso);

    // short, thin, rounded limbs (Animal-Crossing-ish) with mitten hands and rounded feet
    const legL = new T.Group(), legR = new T.Group();
    legL.position.set(-0.105, 0.34, 0); legR.position.set(0.105, 0.34, 0);
    for (const lg of [legL, legR]){
      const m = stub(0.072, 0.16, pants); m.position.y = -0.15; lg.add(m);
      const shoe = new T.Mesh(new T.SphereGeometry(0.09, 12, 10), dark);
      shoe.position.set(0, -0.31, 0.05); shoe.scale.set(1, 0.62, 1.4); lg.add(shoe);
      root.add(lg);
    }
    const armL = new T.Group(), armR = new T.Group();
    armL.position.set(-0.235, 0.72, 0); armR.position.set(0.235, 0.72, 0);
    armL.rotation.z = -0.13; armR.rotation.z = 0.13;
    for (const am of [armL, armR]){
      const m = stub(0.062, 0.18, shirt); m.position.y = -0.15; am.add(m);

    }

    // big round head
    const HY = 1.15, HR = 0.42, HY0 = 1.08, k = HR / 0.34;
    const head = new T.Mesh(new T.SphereGeometry(HR, 24, 20), skin); head.position.y = HY; head.scale.set(1.02, 1.04, 1.0); root.add(head);
    const hy = (y) => HY + (y - HY0) * k, hk = (v) => v * k;
    const addHair = (geo, x, y, z, sx, sy, sz) => { const m = new T.Mesh(geo, hair); m.position.set(x, y, z); if (sx !== undefined) m.scale.set(sx, sy, sz); root.add(m); return m; };
    addHair(new T.SphereGeometry(hk(0.40), 30, 22, 0, Math.PI * 2, 0, Math.PI * 0.47), 0, hy(1.085), hk(-0.02), 1.0, 1.04, 1.0);
    if (style === 0) addHair(new T.SphereGeometry(hk(0.36), 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), 0, hy(1.06), hk(-0.12), 1.0, 1.15, 1.0);
    else if (style === 1){ addHair(new T.SphereGeometry(hk(0.16), 14, 12), 0, hy(1.03), hk(-0.42), 0.9, 1.7, 0.9); addHair(new T.SphereGeometry(hk(0.075), 10, 8), 0, hy(1.22), hk(-0.30)); }
    else if (style === 2) for (const s of [-1, 1]){ addHair(new T.SphereGeometry(hk(0.14), 14, 12), s * hk(0.34), hy(0.98), hk(-0.16), 0.9, 1.5, 0.9); addHair(new T.SphereGeometry(hk(0.06), 10, 8), s * hk(0.30), hy(1.18), hk(-0.10)); }
    else if (style === 3) for (let i = 0; i < 5; i++){ const a = i / 5 * Math.PI * 2; const m = addHair(new T.ConeGeometry(hk(0.09), hk(0.26), 8), Math.cos(a) * hk(0.15), hy(1.40), Math.sin(a) * hk(0.15) - hk(0.02)); m.rotation.z = -Math.cos(a) * 0.5; m.rotation.x = Math.sin(a) * 0.5; }
    else if (style === 4){ addHair(new T.SphereGeometry(hk(0.365), 26, 20, Math.PI / 2 + 0.5, Math.PI * 2 - 1.0, 0, Math.PI * 0.97), 0, hy(1.08), hk(-0.02), 1.0, 1.12, 1.0); }
    else if (style === 5){ }
    else if (style === 6){ addHair(new T.SphereGeometry(hk(0.17), 14, 12), 0, hy(1.31), hk(-0.17), 1.0, 0.95, 1.0); addHair(new T.SphereGeometry(hk(0.07), 10, 8), 0, hy(1.40), hk(-0.16)); }
    else if (style === 7){ addHair(new T.SphereGeometry(hk(0.15), 14, 12), hk(0.34), hy(1.02), hk(-0.20), 0.9, 1.6, 0.9); addHair(new T.SphereGeometry(hk(0.07), 10, 8), hk(0.30), hy(1.22), hk(-0.14)); addHair(new T.SphereGeometry(hk(0.31), 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.5), hk(0.05), hy(1.10), hk(-0.02), 1.0, 1.0, 1.0); }
    else { addHair(new T.SphereGeometry(hk(0.20), 14, 12), -hk(0.30), hy(1.02), hk(-0.10), 1.0, 1.3, 1.0); addHair(new T.SphereGeometry(hk(0.20), 14, 12), hk(0.30), hy(1.02), hk(-0.10), 1.0, 1.3, 1.0); addHair(new T.SphereGeometry(hk(0.16), 12, 10), -hk(0.30), hy(0.80), hk(-0.02), 1.0, 1.4, 1.0); addHair(new T.SphereGeometry(hk(0.16), 12, 10), hk(0.30), hy(0.80), hk(-0.02), 1.0, 1.4, 1.0); }

    // simple Animal-Crossing face: modest black oval eyes + tiny highlight, small nose/mouth
    for (const s of [-1, 1]){
      const eye = new T.Mesh(new T.SphereGeometry(0.066, 14, 12), dark);
      eye.position.set(s * 0.15, 1.12, 0.375); eye.scale.set(0.85, 1.2, 0.7); root.add(eye);
      const hi = new T.Mesh(new T.SphereGeometry(0.027, 8, 6), white);
      hi.position.set(s * 0.132, 1.152, 0.42); hi.scale.set(1, 1.1, 1); root.add(hi);
      const cheek = new T.Mesh(new T.SphereGeometry(0.05, 8, 8), blush);
      cheek.position.set(s * 0.245, 1.025, 0.30); cheek.scale.set(0.9, 0.6, 0.3); root.add(cheek);
    }
    const mouth = new T.Mesh(new T.SphereGeometry(0.026, 8, 6), dark); mouth.position.set(0, 0.99, 0.40); mouth.scale.set(1.6, 0.5, 0.5); root.add(mouth);
    g.traverse((o) => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    return { g, root, legL, legR, armL, armR, sit: false, phase: Math.random() * 9 };
  }
  function pose(p, t, walking){
    const L = p.legL, R = p.legR, AL = p.armL, AR = p.armR;
    if (p.sit){
      p.root.position.y = -0.26 + Math.sin(t * 1.3 + p.phase) * 0.008;
      p.root.rotation.z = Math.sin(t * 0.8 + p.phase) * 0.03;
      L.rotation.set(-1.5, 0, 0.12); R.rotation.set(-1.5, 0, -0.12);
      AL.rotation.x = AR.rotation.x = -0.3;
    } else if (walking){
      const s = Math.sin(t * 10);
      p.root.position.y = Math.abs(Math.sin(t * 10)) * 0.045;
      p.root.rotation.z = s * 0.05;
      L.rotation.set(s * 0.75, 0, 0); R.rotation.set(-s * 0.75, 0, 0);
      AL.rotation.x = -s * 0.6; AR.rotation.x = s * 0.6;
    } else {
      p.root.position.y = Math.sin(t * 1.6 + p.phase) * 0.014;
      p.root.rotation.z = 0;
      L.rotation.set(0, 0, 0); R.rotation.set(0, 0, 0);
      AL.rotation.x = Math.sin(t * 1.6 + p.phase) * 0.04;
      AR.rotation.x = -Math.sin(t * 1.6 + p.phase) * 0.04;
    }
  }
  function beachPoint(deg){
    const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    let r = 100;
    while (r < 900 && hAt(c * r, s * r) > 0.55) r += 2;
    while (r > 100 && hAt(c * r, s * r) < 0.62) r -= 1;
    const v = new T.Vector3(c * r, 0, s * r);
    v.y = hAt(v.x, v.z);
    return v;
  }

  const BEARING = 205;
  const spawn = beachPoint(BEARING);
  const outward = spawn.clone().setY(0).normalize();

  const MY_SHIRT = pick(PASTELS);
  const MY_STYLE = Math.floor(Math.random() * 9);
  const player = makePerson(MY_SHIRT, pick(PANTS), pick(SKINS), pick(HAIRS), MY_STYLE);
  player.sit = true;
  player.g.position.copy(spawn);
  player.g.lookAt(spawn.clone().add(outward));
  scene.add(player.g);
  pose(player, 0, false);

  const side = new T.Vector3(outward.z, 0, -outward.x);
  const aspectDist = Math.min(2.3, Math.max(1, 1 / Math.max(0.35, camera.aspect)));
  const seatCam = (out) => player.g.position.clone()
    .addScaledVector(out, -4.8 * aspectDist).addScaledVector(side, 1.6 * aspectDist)
    .add(new T.Vector3(0, 1.7 * Math.sqrt(aspectDist), 0));
  camera.position.copy(seatCam(outward));
  controls.target.copy(spawn).add(new T.Vector3(0, 1.1, 0));
  controls.maxDistance = 60;
  controls.update();

  let seated = true, gliding = 0;
  const goalCam = new T.Vector3();
  function toggleSit(){
    seated = !seated;
    player.sit = seated;
    sitBtn?.classList.toggle('on', seated);
    if (sitBtn) sitBtn.textContent = seated ? 'stand' : 'sit';
    if (seated){
      goalCam.copy(seatCam(outward));
      gliding = 1;
      controls.enabled = false;
    }
  }
  sitBtn?.addEventListener('click', toggleSit);
  addEventListener('keydown', (e) => { if (e.code === 'KeyF' && !e.repeat) toggleSit(); });

  const keys = {};
  addEventListener('keydown', (e) => { keys[e.code] = true; });
  addEventListener('keyup', (e) => { keys[e.code] = false; });

  const joy = document.getElementById('joy'), knob = document.getElementById('joy-knob');
  const stick = { x: 0, y: 0, id: null };
  if (joy){
    const set = (e) => {
      const r = joy.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const len = Math.hypot(dx, dy), max = r.width / 2 - 20;
      if (len > max){ dx *= max / len; dy *= max / len; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      stick.x = dx / max; stick.y = dy / max;
    };
    joy.addEventListener('pointerdown', (e) => { stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); set(e); });
    joy.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) set(e); });
    const end = (e) => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; };
    joy.addEventListener('pointerup', end);
    joy.addEventListener('pointercancel', end);
  }

  /* real visitors — bundled serverless P2P (trystero/nostr); auto-reconnect + staleness sweep */
  const peersEl = document.getElementById('peers');
  const remotes = new Map();
  const MY = { n: '파도' + Math.floor(100 + Math.random() * 900), c: MY_SHIRT, hs: MY_STYLE };
  function makeTag(text){
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
    const g2 = cv.getContext('2d');
    g2.fillStyle = 'rgba(5,11,16,.55)'; g2.fillRect(58, 10, 140, 44);
    g2.font = '700 28px ui-monospace, Menlo, Consolas, monospace';
    g2.textAlign = 'center'; g2.textBaseline = 'middle';
    g2.fillStyle = '#cfe3ee'; g2.fillText(text, 128, 33);
    const sp = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(cv), transparent: true, depthWrite: false }));
    sp.scale.set(2.0, 0.5, 1); sp.position.y = 1.75;
    return sp;
  }
  let netUp = false;
  function setPeersText(){
    if (!peersEl) return;
    peersEl.textContent = netUp ? (remotes.size + 1) + ' here' : 'connecting…';
  }
  function addRemote(id, st){
    const p = makePerson((Number(st.c) || pick(PASTELS)) & 0xffffff, pick(PANTS), pick(SKINS), pick(HAIRS), Math.abs(Number(st.hs) || 0) % 9);
    p.sit = !!st.sit;
    p.g.position.set(+st.x || 0, +st.y || 0, +st.z || 0);
    p.g.rotation.y = +st.ry || 0;
    p.g.add(makeTag(String(st.n || 'guest').slice(0, 8)));
    scene.add(p.g);
    remotes.set(id, { p, tp: p.g.position.clone(), ry: p.g.rotation.y, sit: p.sit, seen: performance.now() });
    setPeersText();
  }
  function dropRemote(id){
    const r = remotes.get(id);
    if (r){ scene.remove(r.p.g); remotes.delete(id); setPeersText(); }
  }
  const selfState = () => ({
    x: +player.g.position.x.toFixed(2), y: +player.g.position.y.toFixed(2), z: +player.g.position.z.toFixed(2),
    ry: +player.g.rotation.y.toFixed(2), sit: seated ? 1 : 0, c: MY.c, n: MY.n, hs: MY.hs,
  });
  let room = null;
  room = app.createRoom({
    onJoin: () => { room.send(selfState()); setPeersText(); },
    onLeave: (id) => dropRemote(id),
    onState: (id, st) => {
      if (!remotes.has(id)) addRemote(id, st);
      const r = remotes.get(id);
      r.tp.set(+st.x || 0, +st.y || 0, +st.z || 0);
      r.ry = +st.ry || 0;
      r.sit = !!st.sit;
      r.seen = performance.now();
    },
    onStatus: (s) => { netUp = (s === 'online'); setPeersText(); },
    onEvent: (data) => { if (netEvent) netEvent(data); },
  });
  netRoom = room;
  setInterval(() => room.send(selfState()), 150);
  setInterval(() => {
    const now = performance.now();
    for (const [id, r] of remotes) if (now - (r.seen || 0) > 12000) dropRemote(id);
  }, 2500);
  addEventListener('pagehide', () => room.leave());

  const head = new T.Vector3(), fwd = new T.Vector3(), dir = new T.Vector3(), right = new T.Vector3(), _look = new T.Vector3();
  let last = 0, stepTimer = 0;
  function tick(now){
    const dt = last ? Math.min(0.1, Math.max(0, (now - last) / 1000)) : 0;
    last = now;
    const t = now / 1000;

    if (seaTick) seaTick(dt);

    if (gliding){
      gliding = Math.max(0, gliding - dt / 1.1);
      camera.position.lerp(goalCam, 1 - Math.pow(0.001, dt));
      if (!gliding) controls.enabled = true;
    }

    const ix = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) + stick.x;
    const iz = ((keys.KeyS || keys.ArrowDown) ? 1 : 0) - ((keys.KeyW || keys.ArrowUp) ? 1 : 0) + stick.y;
    const mag = Math.min(Math.hypot(ix, iz), 1);
    if (seated && mag > 0.35) toggleSit();
    const moving = !seated && mag > 0.06;
    if (moving){
      camera.updateWorldMatrix(true, false);
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      const e = camera.matrixWorld.elements;          // camera local +X = screen right, always
      right.set(e[0], e[1], e[2]); right.y = 0; right.normalize();
      dir.copy(fwd).multiplyScalar(-iz).addScaledVector(right, ix).normalize();
      const swim = hAt(player.g.position.x, player.g.position.z) < -1.0;
      const sp = (swim ? 1.7 : (keys.ShiftLeft || keys.ShiftRight) ? 7.0 : 3.4) * mag;
      const np = player.g.position.clone().addScaledVector(dir, sp * dt);
      const nh = hAt(np.x, np.z);
      if (np.length() < 900){
        np.y = nh < -1.0 ? -0.45 + Math.sin(t * 1.8) * 0.07 : nh;
        player.g.position.copy(np);
        _look.copy(player.g.position).add(dir);
        player.g.lookAt(_look);
      }
    }
    // water footsteps: splash cadence while walking in the shallows
    if (moving && playStep && hAt(player.g.position.x, player.g.position.z) < 0.1){
      stepTimer -= dt;
      if (stepTimer <= 0){ stepTimer = 0.36; playStep(); }
    } else stepTimer = 0;
    for (const r of remotes.values()){
      r.p.g.position.lerp(r.tp, Math.min(1, dt * 6));
      let d = r.ry - r.p.g.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      r.p.g.rotation.y += d * Math.min(1, dt * 6);
      r.p.sit = r.sit;
      pose(r.p, t, !r.sit && r.p.g.position.distanceTo(r.tp) > 0.25);
    }
    pose(player, t, moving);

    head.copy(player.g.position); head.y += seated ? 0.85 : 1.3;
    const fk = 1 - Math.pow(0.0005, dt);
    const ddx = (head.x - controls.target.x) * fk, ddy = (head.y - controls.target.y) * fk, ddz = (head.z - controls.target.z) * fk;
    controls.target.x += ddx; controls.target.y += ddy; controls.target.z += ddz;
    camera.position.x += ddx; camera.position.y += ddy; camera.position.z += ddz;
    controls.update();
    app.renderer.shadowMap.needsUpdate = true;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------- fireworks system + shop (shared with everyone in the room) ---------- */
if (app){
  const T = app.THREE, scene = app.scene;

  // soft round sprite
  const dotTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(32, 32, 32, 0, Math.PI * 2); g.fill();
    return new T.CanvasTexture(c);
  })();

  const MAX = 8000;
  const fpos = new Float32Array(MAX * 3), fcol = new Float32Array(MAX * 3), fsiz = new Float32Array(MAX), falp = new Float32Array(MAX);
  const fvel = new Float32Array(MAX * 3), flife = new Float32Array(MAX), fmax = new Float32Array(MAX);
  const fgrav = new Float32Array(MAX), fdrag = new Float32Array(MAX), ftw = new Float32Array(MAX), fseed = new Float32Array(MAX);
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(fpos, 3));
  geo.setAttribute('aColor', new T.BufferAttribute(fcol, 3));
  geo.setAttribute('aSize', new T.BufferAttribute(fsiz, 1));
  geo.setAttribute('aAlpha', new T.BufferAttribute(falp, 1));
  const fmat = new T.ShaderMaterial({
    uniforms: { uTex: { value: dotTex }, uScale: { value: 600 } },
    transparent: true, depthWrite: false, depthTest: true, blending: T.AdditiveBlending,
    vertexShader: `attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
      varying vec3 vColor; varying float vAlpha; uniform float uScale;
      void main(){ vColor=aColor; vAlpha=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize = max(1.0, aSize * uScale / max(0.1, -mv.z)); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform sampler2D uTex; varying vec3 vColor; varying float vAlpha;
      void main(){ vec4 t=texture2D(uTex, gl_PointCoord); if (t.a < 0.01) discard; gl_FragColor=vec4(vColor, t.a*vAlpha); }`,
  });
  const fpoints = new T.Points(geo, fmat);
  fpoints.frustumCulled = false;
  scene.add(fpoints);

  let fcursor = 0;
  function emit1(x, y, z, vx, vy, vz, r, g, b, size, lifeSec, grav, dragK, tw) {
    for (let k = 0; k < MAX; k++) {
      const i = (fcursor + k) % MAX;
      if (flife[i] <= 0) {
        fcursor = (i + 1) % MAX;
        const i3 = i * 3; fpos[i3] = x; fpos[i3 + 1] = y; fpos[i3 + 2] = z;
        fvel[i3] = vx; fvel[i3 + 1] = vy; fvel[i3 + 2] = vz;
        fcol[i3] = r; fcol[i3 + 1] = g; fcol[i3 + 2] = b;
        fsiz[i] = size; falp[i] = 1; flife[i] = lifeSec; fmax[i] = lifeSec;
        fgrav[i] = grav; fdrag[i] = dragK; ftw[i] = tw; fseed[i] = Math.random() * 10;
        return;
      }
    }
  }
  const randUnit = () => { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u); return [s * Math.cos(a), u, s * Math.sin(a)]; };
  const randColor = () => { const c = new T.Color().setHSL(Math.random(), 0.85, 0.6); return [c.r, c.g, c.b]; };

  const TYPES = [
    { id: 'peony', name: '모란 피오니', price: 1000, shape: 'sphere', count: 150, speed: 9, life: 1.7, size: 0.55, grav: -6, drag: 0.7, tw: 0 },
    { id: 'ring', name: '고리 링', price: 1500, shape: 'ring', count: 130, speed: 8.5, life: 1.7, size: 0.55, grav: -5, drag: 0.7, tw: 0 },
    { id: 'willow', name: '버들 (금색)', price: 2500, shape: 'sphere', count: 130, speed: 6, life: 3.0, size: 0.6, grav: -11, drag: 0.5, tw: 0, color: () => [1, 0.82, 0.32] },
    { id: 'palm', name: '야자수', price: 2000, shape: 'palm', count: 22, speed: 9.5, life: 2.1, size: 1.15, grav: -8, drag: 0.6, tw: 0 },
    { id: 'heart', name: '하트', price: 3000, shape: 'heart', count: 150, speed: 7.5, life: 1.9, size: 0.5, grav: -5, drag: 0.75, tw: 0, color: () => [1, 0.28, 0.5] },
    { id: 'double', name: '이중 (2색)', price: 2000, shape: 'double', count: 180, speed: 9.5, life: 1.8, size: 0.52, grav: -6, drag: 0.7, tw: 0 },
    { id: 'glitter', name: '반짝 글리터', price: 1500, shape: 'sphere', count: 240, speed: 8, life: 1.5, size: 0.3, grav: -6, drag: 0.7, tw: 1 },
    { id: 'crackle', name: '파직 크래클', price: 1800, shape: 'sphere', count: 200, speed: 10.5, life: 1.2, size: 0.32, grav: -7, drag: 0.7, tw: 2 },
  ];

  function burst(x, y, z, ty) {
    const base = ty.color ? ty.color() : randColor();
    const c2 = randColor();
    const n = ty.count, sp = ty.speed;
    if (ty.shape === 'ring') {
      const ax = randUnit();
      const t1 = (() => { const u = Math.abs(ax[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]; const c = [ax[1] * u[2] - ax[2] * u[1], ax[2] * u[0] - ax[0] * u[2], ax[0] * u[1] - ax[1] * u[0]]; const l = Math.hypot(c[0], c[1], c[2]) || 1; return [c[0] / l, c[1] / l, c[2] / l]; })();
      const t2 = [ax[1] * t1[2] - ax[2] * t1[1], ax[2] * t1[0] - ax[0] * t1[2], ax[0] * t1[1] - ax[1] * t1[0]];
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a); const dx = t1[0] * ca + t2[0] * sa, dy = t1[1] * ca + t2[1] * sa, dz = t1[2] * ca + t2[2] * sa; emit1(x, y, z, dx * sp, dy * sp, dz * sp, base[0], base[1], base[2], ty.size, ty.life, ty.grav, ty.drag, ty.tw); }
    } else if (ty.shape === 'heart') {
      const c = new T.Color().setHSL(Math.random(), 0.7, 0.6); base[0] = 1; base[1] = 0.28; base[2] = 0.5;
      for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; const hx = 16 * Math.pow(Math.sin(t), 3); const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); const k = sp / 16; const dz = (Math.random() - 0.5) * 1.2; emit1(x, y, z, hx * k, hy * k, dz, base[0], base[1], base[2], ty.size, ty.life, ty.grav, ty.drag, ty.tw); }
    } else if (ty.shape === 'double') {
      for (let i = 0; i < n; i++) { const u = randUnit(); const inner = i % 2 === 0; const v = sp * (inner ? 0.55 : 1.0); const cc = inner ? base : c2; emit1(x, y, z, u[0] * v, u[1] * v, u[2] * v, cc[0], cc[1], cc[2], ty.size, ty.life, ty.grav, ty.drag, ty.tw); }
    } else if (ty.shape === 'palm') {
      for (let i = 0; i < n; i++) { const u = randUnit(); emit1(x, y, z, u[0] * sp, u[1] * sp, u[2] * sp, base[0], base[1], base[2], ty.size, ty.life, ty.grav, ty.drag, ty.tw); }
    } else {
      for (let i = 0; i < n; i++) { const u = randUnit(); emit1(x, y, z, u[0] * sp, u[1] * sp, u[2] * sp, base[0], base[1], base[2], ty.size, ty.life, ty.grav, ty.drag, ty.tw); }
    }
  }

  const pending = [];
  function launch(typeId, x, z) {
    const ty = TYPES.find((t) => t.id === typeId) || TYPES[0];
    pending.push({ t: 0, dur: 0.9 + Math.random() * 0.35, x, z, y0: 3, y1: 30 + Math.random() * 12, ty, trail: 0 });
  }
  function launchAhead(typeId) {
    const cam = app.camera, d = new T.Vector3(); cam.getWorldDirection(d); d.y = 0; d.normalize();
    const x = cam.position.x + d.x * 75 + (Math.random() - 0.5) * 40;
    const z = cam.position.z + d.z * 75 + (Math.random() - 0.5) * 40;
    launch(typeId, x, z);
    if (netRoom) netRoom.emit({ k: 'fw', t: typeId, x: +x.toFixed(1), z: +z.toFixed(1) });
  }
  netEvent = (data) => { if (data && data.k === 'fw') launch(data.t, +data.x || 0, +data.z || 0); };

  function fwUpdate(dt) {
    // rockets
    for (let i = pending.length - 1; i >= 0; i--) {
      const p = pending[i]; p.t += dt; const f = Math.min(1, p.t / p.dur);
      const y = p.y0 + (p.y1 - p.y0) * f;
      p.trail -= dt;
      if (p.trail <= 0) { p.trail = 0.02; emit1(p.x + (Math.random() - 0.5) * 0.3, y, p.z + (Math.random() - 0.5) * 0.3, 0, -1, 0, 1, 0.7, 0.3, 0.5, 0.4, 0, 0.5, 1); }
      if (f >= 1) { burst(p.x, p.y1, p.z, p.ty); pending.splice(i, 1); }
    }
    // particles
    for (let i = 0; i < MAX; i++) {
      if (flife[i] <= 0) { if (falp[i] !== 0) falp[i] = 0; continue; }
      flife[i] -= dt;
      if (flife[i] <= 0) { falp[i] = 0; continue; }
      const i3 = i * 3;
      fvel[i3 + 1] += fgrav[i] * dt;
      const dk = Math.max(0, 1 - fdrag[i] * dt);
      fvel[i3] *= dk; fvel[i3 + 1] *= dk; fvel[i3 + 2] *= dk;
      fpos[i3] += fvel[i3] * dt; fpos[i3 + 1] += fvel[i3 + 1] * dt; fpos[i3 + 2] += fvel[i3 + 2] * dt;
      let a = Math.min(1, flife[i] / (0.55 * fmax[i]));
      if (ftw[i] === 1) a *= 0.55 + 0.45 * Math.sin((fmax[i] - flife[i]) * 40 + fseed[i] * 9);
      else if (ftw[i] === 2) a *= Math.random() < 0.35 ? 0.25 : 1;
      falp[i] = a;
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.aColor.needsUpdate = true;
    geo.attributes.aSize.needsUpdate = true;
    geo.attributes.aAlpha.needsUpdate = true;
    const gl = app.renderer.getContext();
    fmat.uniforms.uScale.value = (gl.drawingBufferHeight || 600) / (2 * Math.tan((app.camera.fov || 50) * Math.PI / 360));
  }

  let flast = 0;
  function fwLoop(now) {
    const dt = flast ? Math.min(0.05, Math.max(0, (now - flast) / 1000)) : 0; flast = now;
    fwUpdate(dt);
    requestAnimationFrame(fwLoop);
  }
  requestAnimationFrame(fwLoop);

  // ---- shop UI ----
  const css = document.createElement('style');
  css.textContent = `#shop{position:fixed;right:12px;bottom:12px;z-index:30;width:230px;max-height:70vh;overflow-y:auto;
    background:rgba(10,16,22,.86);border:1px solid rgba(140,200,230,.2);border-radius:12px;padding:12px 12px 14px;
    backdrop-filter:blur(12px);color:#cfe3ee;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:0 18px 50px rgba(0,0,0,.5)}
    #shop h3{margin:0 0 4px;font-size:12px;letter-spacing:.16em;color:#ffd76a;text-transform:uppercase}
    #shop .sub{font-size:9px;color:#7d95a4;margin-bottom:9px}
    #shop button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:5px 0;padding:8px 10px;
      border:1px solid rgba(140,200,230,.18);border-radius:8px;background:rgba(140,200,230,.06);color:#dcecf4;font:inherit;cursor:pointer;text-align:left;transition:.15s}
    #shop button:hover{background:rgba(255,215,106,.12);border-color:rgba(255,215,106,.5);color:#fff}
    #shop button:active{transform:scale(.98)}
    #shop .pn{color:#ffd76a;font-weight:700}
    #shop .fire{position:absolute;right:12px;bottom:12px;z-index:29;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,215,106,.5);
      background:rgba(10,16,22,.86);color:#ffd76a;font:700 12px ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
    @media (max-width:620px){#shop{left:10px;right:10px;width:auto;max-height:44vh;bottom:64px}#shop .fire{left:50%;transform:translateX(-50%);bottom:14px}}`;
  document.head.appendChild(css);

  const shop = document.createElement('div');
  shop.id = 'shop';
  const items = TYPES.map((t) => `<button data-id="${t.id}"><span>${t.name}</span><span class="pn">₩${t.price.toLocaleString()}</span></button>`).join('');
  shop.innerHTML = `<h3>불꽃놀이 상점</h3><div class="sub">결제 연동 예정 · 지금은 무료 발사 · 접속자 모두에게 보임</div>${items}`;
  document.body.appendChild(shop);
  shop.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && b.dataset.id) launchAhead(b.dataset.id); });

  const shopBtn = document.createElement('button');
  shopBtn.className = 'fire'; shopBtn.textContent = '불꽃 상점';
  document.body.appendChild(shopBtn);
  let shopOpen = true;
  function applyShop(){ shop.style.display = shopOpen ? 'block' : 'none'; }
  shopBtn.addEventListener('click', () => { shopOpen = !shopOpen; applyShop(); });
  applyShop();
}

window.addEventListener('error', (e) => { if (!app) fatal('Startup failed:<br><code style="color:#ffb">' + (e.message || e) + '</code>'); });
</script>
</body>
</html>
