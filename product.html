<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Luxury Product Viewer | Visual Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle, #222, #000); color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 40px; left: 40px; z-index: 10; pointer-events: none; }
        h1 { font-size: 2rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
        p { font-size: 0.9rem; opacity: 0.6; margin-top: 10px; }
        .controls-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; opacity: 0.4; text-transform: uppercase; letter-spacing: 2px; }
        #error { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; color: red; font-family: monospace; padding: 20px; text-align: center; }
        #side-spec { position: fixed; right: 34px; top: 50%; z-index: 10; display: flex; min-height: 242px; transform: translateY(-50%); flex-direction: column; justify-content: space-between; align-items: flex-end; color: rgba(255,223,181,.76); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; }
        #side-spec::before { content: ''; position: absolute; right: 4px; top: 34px; bottom: 34px; width: 1px; background: linear-gradient(transparent, rgba(255,211,150,.85), transparent); }
        #side-spec .spec-title { writing-mode: vertical-rl; transform: rotate(180deg); }
        #side-spec .spec-dot { position: relative; right: 1px; width: 9px; height: 9px; border: 1px solid currentColor; border-radius: 50%; background: radial-gradient(circle, #fff6e9 0 25%, transparent 31%); box-shadow: 0 0 15px rgba(255,204,135,.55); }
        #side-spec .spec-bar { position: relative; right: 1px; width: 18px; height: 2px; background: linear-gradient(90deg, transparent, currentColor); box-shadow: 0 6px 0 rgba(255,224,180,.52), 0 12px 0 rgba(255,224,180,.26); }
        #side-spec .spec-code { font-size: 8px; color: rgba(232,199,161,.58); writing-mode: vertical-rl; }
        @media (max-width: 640px) { #ui { top: 24px; left: 24px; } .controls-hint { bottom: 22px; width: 100%; text-align: center; } #side-spec { right: 17px; min-height: 158px; font-size: 7px; } #side-spec::before { top: 25px; bottom: 25px; } }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Zenith Chrome</h1>
        <p>High-End PBR Material Study</p>
    </div>
    <div class="controls-hint">Drag to rotate • Scroll to zoom</div>
    <aside id="side-spec" aria-hidden="true">
        <span class="spec-title">material profile</span>
        <span class="spec-dot"></span>
        <span class="spec-bar"></span>
        <span class="spec-code">R 0.05 / M 1.00</span>
    </aside>
    <div id="error"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.onload = async function() {
            const errorDiv = document.getElementById('error');
            try {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.2;
                document.body.appendChild(renderer.domElement);

                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                camera.position.set(3, 2, 5);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
                scene.add(ambientLight);
                const spotLight = new THREE.SpotLight(0xffffff, 50);
                spotLight.position.set(5, 10, 5);
                spotLight.angle = 0.3;
                spotLight.penumbra = 0.5;
                scene.add(spotLight);
                const blueLight = new THREE.PointLight(0x0066ff, 20);
                blueLight.position.set(-5, 2, -2);
                scene.add(blueLight);

                const geometry = new THREE.TorusKnotGeometry(1, 0.3, 200, 32);
                const material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.05 });
                const product = new THREE.Mesh(geometry, material);
                scene.add(product);

                const floorGeo = new THREE.PlaneGeometry(20, 20);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -1.5;
                scene.add(floor);

                function animate() {
                    requestAnimationFrame(animate);
                    product.rotation.y += 0.005;
                    product.rotation.z += 0.002;
                    controls.update();
                    renderer.render(scene, camera);
                }
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                animate();
            } catch(e) {
                errorDiv.style.display = 'flex';
                errorDiv.innerText = "CRITICAL ERROR: " + e.message;
            }
        };
    </script>
</body>
</html>
