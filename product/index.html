<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Luxury Product Viewer | Visual Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle, #222, #000); color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 40px; left: 40px; z-index: 10; pointer-events: none; }
        h1 { font-size: 2rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
        p { font-size: 0.9rem; opacity: 0.6; margin-top: 10px; }
        .controls-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; opacity: 0.4; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Zenith Chrome</h1>
        <p>High-End PBR Material Study</p>
    </div>
    <div class="controls-hint">Drag to rotate • Scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        (function() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            camera.position.set(3, 2, 5);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);
            const spotLight = new THREE.SpotLight(0xffffff, 50);
            spotLight.position.set(5, 10, 5);
            scene.add(spotLight);
            const blueLight = new THREE.PointLight(0x0066ff, 20);
            blueLight.position.set(-5, 2, -2);
            scene.add(blueLight);

            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 200, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.05 });
            const product = new THREE.Mesh(geometry, material);
            scene.add(product);

            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.5;
            scene.add(floor);

            function animate() {
                requestAnimationFrame(animate);
                product.rotation.y += 0.005;
                product.rotation.z += 0.002;
                controls.update();
                renderer.render(scene, camera);
            }
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        })();
    </script>
</body>
</html>
